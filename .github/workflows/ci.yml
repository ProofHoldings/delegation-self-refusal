# CI for this mirror. The package is developed in ProofHoldings' main repository and copied here, this
# file included, at each release; its full suite runs there on every change. This job shows the copy
# stands on its own: it installs, builds, typechecks and passes every test that needs nothing outside
# this repository. The few that read the main repository skip here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck --if-present
      - run: npm test
